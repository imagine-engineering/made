# Generated from xtask::workflows::release_promotion
# Rebuild with `cargo xtask workflows`.
name: release_promotion
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  push:
    tags:
    - rust-v*
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component for a manual release: patch, minor, or major'
        type: string
        default: patch
      version:
        description: Optional exact X.Y.Z version for manual recovery
        type: string
        default: ''
      commit_sha:
        description: Optional tested release commit SHA; defaults to the selected release commit
        type: string
        default: ''
  workflow_run:
    types:
    - completed
    workflows:
    - run_tests
    branches:
    - release
permissions:
  contents: read
jobs:
  prepare_release:
    if: vars.COPPER_RELEASE_ENABLED == 'true' && vars.COPPER_RELEASE_BOOTSTRAP_SHA != '' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'release' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha != vars.COPPER_RELEASE_BOOTSTRAP_SHA) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-v')))
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        ref: main
    - name: release::promotion_check
      run: |
        set -euo pipefail
        if [[ "$RELEASE_ENABLED" != "true" || ! "$BOOTSTRAP_SHA" =~ ^[0-9a-f]{40}$ || ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release promotion is disabled or the bootstrap/commit SHA is invalid" >&2
            exit 1
        fi
        git fetch origin +refs/heads/release:refs/remotes/origin/release --tags
        if [[ "$COMMIT_SHA" == "$BOOTSTRAP_SHA" ]]; then
            echo "The initial release-branch commit can never be released" >&2
            exit 1
        fi
        git merge-base --is-ancestor "$BOOTSTRAP_SHA" "$COMMIT_SHA"
        RELEASE_HISTORY="$(git rev-list --first-parent origin/release)"
        if ! grep -Fxq "$COMMIT_SHA" <<<"$RELEASE_HISTORY"; then
            echo "Release commit is not on the first-parent history of origin/release" >&2
            exit 1
        fi
        CI_RUNS="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/run_tests.yml/runs" \
            -f branch=release -f event=push -f head_sha="$COMMIT_SHA" -f per_page=100 --paginate --slurp)"
        if ! jq -e --arg commit "$COMMIT_SHA" --arg repository "$GITHUB_REPOSITORY" --arg run_id "$CI_RUN_ID" '
            [.[].workflow_runs[]] | max_by(.id) |
            .head_sha == $commit and .head_branch == "release" and .event == "push" and
            .head_repository.full_name == $repository and .repository.full_name == $repository and
            .path == ".github/workflows/run_tests.yml" and
            .status == "completed" and .conclusion == "success" and
            ($run_id == "" or (.id | tostring) == $run_id)
        ' <<<"$CI_RUNS" >/dev/null; then
            echo "The latest exact-commit release push CI must have completed successfully in this repository" >&2
            exit 1
        fi
      env:
        COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
        BOOTSTRAP_SHA: ${{ vars.COPPER_RELEASE_BOOTSTRAP_SHA }}
        RELEASE_ENABLED: ${{ vars.COPPER_RELEASE_ENABLED }}
        CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        fetch-tags: true
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
    - id: resolve-release
      name: release::prepare_release
      run: |
        git fetch origin +refs/heads/release:refs/remotes/origin/release --tags

        ARGS=(release-version --commit "$COMMIT_SHA" --bootstrap-commit "$BOOTSTRAP_SHA" --bump "$BUMP")
        if [[ -n "$EXPLICIT_VERSION" ]]; then
            ARGS+=(--explicit-version "$EXPLICIT_VERSION")
        fi
        if [[ -n "$EXISTING_TAG" ]]; then
            ARGS+=(--existing-tag "$EXISTING_TAG")
        fi
        DECISION="$(cargo xtask "${ARGS[@]}")"
        jq -e '.commit_sha and .version and .tag' <<<"$DECISION" >/dev/null
        {
            echo "commit_sha=$(jq -r '.commit_sha' <<<"$DECISION")"
            echo "version=$(jq -r '.version' <<<"$DECISION")"
            echo "tag=$(jq -r '.tag' <<<"$DECISION")"
        } >> "$GITHUB_OUTPUT"
      env:
        COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
        BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        EXPLICIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        BOOTSTRAP_SHA: ${{ vars.COPPER_RELEASE_BOOTSTRAP_SHA }}
        EXISTING_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    - name: release::generate_release_bundle_plans
      run: |
        mkdir -p release-bundle-plans
        target/debug/xtask bundle --product rust --platform linux --target x86_64-unknown-linux-gnu --signing required --dry-run \
            | jq --arg commit_sha "$COMMIT_SHA" '. + {commit_sha: $commit_sha}' > release-bundle-plans/rust-linux-x86_64.json
        target/debug/xtask bundle --product rust --platform macos --target aarch64-apple-darwin --signing required --dry-run \
            | jq --arg commit_sha "$COMMIT_SHA" '. + {commit_sha: $commit_sha}' > release-bundle-plans/rust-macos-aarch64.json
        target/debug/xtask bundle --product rust --platform windows --target x86_64-pc-windows-msvc --signing required --dry-run \
            | jq --arg commit_sha "$COMMIT_SHA" '. + {commit_sha: $commit_sha}' > release-bundle-plans/rust-windows-x86_64.json
      env:
        COMMIT_SHA: ${{ steps.resolve-release.outputs.commit_sha }}
        RELEASE_VERSION: ${{ steps.resolve-release.outputs.version }}
    - name: release::prepare_release
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-bundle-plans
        path: release-bundle-plans
        if-no-files-found: error
    outputs:
      commit_sha: ${{ steps.resolve-release.outputs.commit_sha }}
      version: ${{ steps.resolve-release.outputs.version }}
      tag: ${{ steps.resolve-release.outputs.tag }}
    timeout-minutes: 15
  signing_preflight:
    needs:
    - prepare_release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::signing_preflight
      run: python3 script/check-signing-environment --platform macos --policy required
      env:
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    - name: release::signing_preflight
      run: python3 script/check-signing-environment --platform windows --policy required
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ACCOUNT_NAME: ${{ secrets.ACCOUNT_NAME }}
        CERT_PROFILE_NAME: ${{ secrets.CERT_PROFILE_NAME }}
        ENDPOINT: ${{ secrets.ENDPOINT }}
        WINDOWS_SIGNING_PUBLISHER: ${{ secrets.WINDOWS_SIGNING_PUBLISHER }}
        FILE_DIGEST: ${{ secrets.FILE_DIGEST }}
        TIMESTAMP_DIGEST: ${{ secrets.TIMESTAMP_DIGEST }}
        TIMESTAMP_SERVER: ${{ secrets.TIMESTAMP_SERVER }}
    - name: release::signing_preflight
      run: python3 script/check-signing-environment --platform linux --policy required
      env:
        LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        LINUX_SIGNING_KEY_PASSWORD: ${{ secrets.LINUX_SIGNING_KEY_PASSWORD }}
        LINUX_SIGNING_KEY_FINGERPRINT: ${{ secrets.LINUX_SIGNING_KEY_FINGERPRINT }}
    timeout-minutes: 5
  release_licenses:
    needs:
    - prepare_release
    - signing_preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: steps::install_cargo_about
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
      with:
        tool: cargo-about@0.8.2
        fallback: none
    - name: release::release_licenses
      run: |
        sha256_file() {
            sha256sum "$1" | awk '{print $1}'
        }
        test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
        git diff --quiet "$COMMIT_SHA" -- Cargo.lock
        script/generate-licenses
        mkdir -p release-licenses
        cp assets/licenses.md release-licenses/licenses.md
        CARGO_LOCK_BLOB="$(git rev-parse "${COMMIT_SHA}:Cargo.lock")"
        LICENSES_HASH="$(sha256_file release-licenses/licenses.md)"
        jq -n \
            --arg commit_sha "$COMMIT_SHA" \
            --arg cargo_lock_blob "$CARGO_LOCK_BLOB" \
            --arg licenses_hash "$LICENSES_HASH" \
            '{commit_sha: $commit_sha, cargo_lock_blob: $cargo_lock_blob, licenses_hash: $licenses_hash}' \
            > release-licenses/metadata.json
      env:
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::release_licenses
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-licenses
        path: release-licenses
        if-no-files-found: error
    timeout-minutes: 20
  application_builds:
    needs:
    - prepare_release
    - release_licenses
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
      SCCACHE_GHA_ENABLED: on
      SCCACHE_IDLE_TIMEOUT: '0'
      RUSTC_WRAPPER: sccache
      CARGO_TARGET_DIR: target/products/${{ matrix.product }}
      ZED_PRODUCT_ID: ${{ matrix.product }}
      ZED_PRODUCT_DISPLAY_NAME: ${{ matrix.display_name }}
      ZED_PRODUCT_EXECUTABLE: ${{ matrix.executable_name }}
      ZED_PRODUCT_BUNDLE_ID: ${{ matrix.bundle_identifier }}
      ZED_PRODUCT_URL_SCHEME: ${{ matrix.url_scheme }}
      ZED_PRODUCT_ICON_SET: ${{ github.workspace }}/${{ matrix.icon_set }}
      ZED_PRODUCT_DATA_NAMESPACE: ${{ matrix.data_namespace }}
      ZED_PRODUCT_UPDATE_NAMESPACE: ${{ matrix.update_namespace }}
      ZED_PRODUCT_WINDOWS_INSTALLER_ID: ${{ matrix.windows_installer_id }}
      ZED_PRODUCT_APP_FEATURES: ${{ matrix.application_features }}
      ZED_PRODUCT_REMOTE_FEATURES: ${{ matrix.remote_features }}
      ZED_RELEASE_CHANNEL: stable
    strategy:
      matrix:
        include:
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: linux
          runner: ubuntu-22.04
          target: x86_64-unknown-linux-gnu
          remote_target: x86_64-unknown-linux-musl
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-linux-x86_64
          remote_artifact: rust-remote-server-linux-x86_64
          plan_file: rust-linux-x86_64.json
          artifact: rust-linux-x86_64
          artifact_suffix: linux-x86_64.tar.gz
          artifact_path: target/products/rust/release/rust-*-linux-x86_64.tar.gz*
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: macos
          runner: macos-15
          target: aarch64-apple-darwin
          remote_target: aarch64-apple-darwin
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-macos-aarch64
          remote_artifact: rust-remote-server-macos-aarch64
          plan_file: rust-macos-aarch64.json
          artifact: rust-macos-aarch64
          artifact_suffix: macos-aarch64.dmg
          artifact_path: target/products/rust/release/rust-*-macos-aarch64.dmg
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: windows
          runner: windows-2022
          target: x86_64-pc-windows-msvc
          remote_target: x86_64-pc-windows-msvc
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-windows-x86_64
          remote_artifact: rust-remote-server-windows-x86_64
          plan_file: rust-windows-x86_64.json
          artifact: rust-windows-x86_64
          artifact_suffix: windows-x86_64.exe
          artifact_path: target/products/rust/release/rust-*-windows-x86_64.exe
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::application_builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-licenses
        path: release-licenses
    - name: release::verify_release_licenses
      run: |
        sha256_file() {
            if [[ "$RUNNER_OS" == "macOS" ]]; then
                shasum -a 256 "$1" | awk '{print $1}'
            else
                sha256sum "$1" | awk '{print $1}'
            fi
        }
        test -s release-licenses/licenses.md
        test -s release-licenses/metadata.json
        test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
        git diff --quiet "$COMMIT_SHA" -- Cargo.lock
        CARGO_LOCK_BLOB="$(git rev-parse "${COMMIT_SHA}:Cargo.lock")"
        LICENSES_HASH="$(sha256_file release-licenses/licenses.md)"
        jq -e \
            --arg commit_sha "$COMMIT_SHA" \
            --arg cargo_lock_blob "$CARGO_LOCK_BLOB" \
            --arg licenses_hash "$LICENSES_HASH" \
            '.commit_sha == $commit_sha and .cargo_lock_blob == $cargo_lock_blob and .licenses_hash == $licenses_hash' \
            release-licenses/metadata.json >/dev/null
        cp release-licenses/licenses.md assets/licenses.md
      env:
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::configure_release_cache_namespace
      run: |
        TOOLCHAIN_HASH="$(git hash-object rust-toolchain.toml)"
        echo "SCCACHE_GHA_VERSION=release-v2-${RUNNER_OS}-${CACHE_TARGET}-${TOOLCHAIN_HASH}" >> "$GITHUB_ENV"
      env:
        CACHE_TARGET: ${{ matrix.target }}
    - name: steps::setup_release_sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0
        disable_annotations: 'true'
    - name: steps::enable_windows_long_paths
      if: matrix.platform == 'windows'
      run: git config --global core.longpaths true
      shell: pwsh
    - name: release::application_builds
      if: matrix.platform == 'linux'
      run: ./script/linux && ./script/download-wasi-sdk
    - name: release::application_builds
      if: matrix.platform == 'linux'
      run: |
        export ZED_PRODUCT_ARTIFACT_NAME="${ZED_PRODUCT_ID}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
        export ZED_BUNDLE_PHASE=application
        script/bundle-linux
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        ZED_PREGENERATED_LICENSES: '1'
        CC: clang
        CXX: clang++
    - name: release::application_builds
      if: matrix.platform == 'macos'
      run: |
        export ZED_PRODUCT_ARTIFACT_NAME="${ZED_PRODUCT_ID}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
        export ZED_BUNDLE_PHASE=application
        script/bundle-mac "$TARGET"
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        TARGET: ${{ matrix.target }}
        ZED_PREGENERATED_LICENSES: '1'
    - name: release::application_builds
      if: matrix.platform == 'windows'
      run: |
        cargo test -p auto_update_helper --locked
        if ($LASTEXITCODE -ne 0) { throw "Windows updater tests failed" }
        bash ./script/clippy --no-all-features -p auto_update_helper
        if ($LASTEXITCODE -ne 0) { throw "Windows updater Clippy failed" }
      shell: pwsh
    - name: release::application_builds
      if: matrix.platform == 'windows'
      run: |
        $env:ZED_PRODUCT_ARTIFACT_NAME = "$env:ZED_PRODUCT_ID-$env:RELEASE_VERSION-$env:ARTIFACT_SUFFIX"
        $env:ZED_BUNDLE_PHASE = "application"
        script/bundle-windows.ps1 -Architecture x86_64
      shell: pwsh
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        ZED_PREGENERATED_LICENSES: '1'
    - name: release::application_builds
      if: matrix.platform != 'windows'
      run: |
        SOURCE="target/products/${PRODUCT_ID}/${TARGET}/release"
        mkdir -p release-application
        cp "$SOURCE/zed" "$SOURCE/cli" release-application/
        if [[ "$TARGET" == *-apple-darwin ]]; then
            cp "$SOURCE/native-cargo-runtime-observer" release-application/
        fi
        jq -n --arg commit_sha "$COMMIT_SHA" --arg target "$TARGET" --arg features "$FEATURES" \
            '{commit_sha: $commit_sha, target: $target, features: $features}' > release-application/metadata.json
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        FEATURES: ${{ matrix.application_features }}
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::application_builds
      if: matrix.platform == 'windows'
      run: |
        $source = "target/products/$env:PRODUCT_ID/$env:TARGET/release"
        New-Item -ItemType Directory -Path release-application -Force | Out-Null
        Copy-Item "$source/zed.exe", "$source/cli.exe", "$source/auto_update_helper.exe", "$source/zed.pdb", "$source/cli.pdb", "$source/auto_update_helper.pdb" -Destination release-application
        @{
            commit_sha = $env:COMMIT_SHA
            target = $env:TARGET
            features = $env:FEATURES
        } | ConvertTo-Json | Set-Content release-application/metadata.json
      shell: pwsh
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        FEATURES: ${{ matrix.application_features }}
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::application_builds
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.application_artifact }}
        path: release-application
        if-no-files-found: error
    - name: steps::finalize_release_sccache
      if: always() && matrix.platform != 'windows'
      run: |
        STATS="$(sccache --show-stats)"
        printf '%s\n' "$STATS"
        {
            printf '### sccache: %s / %s\n\n```text\n' "$RUNNER_OS" "$SCCACHE_GHA_VERSION"
            printf '%s\n' "$STATS"
            printf '```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        sccache --stop-server
    - name: steps::finalize_release_sccache
      if: always() && matrix.platform == 'windows'
      run: |
        $stats = (& sccache --show-stats | Out-String)
        if ($LASTEXITCODE -ne 0) {
            throw "sccache --show-stats failed with exit code $LASTEXITCODE"
        }
        Write-Host $stats
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('### sccache: {0} / {1}' -f $env:RUNNER_OS, $env:SCCACHE_GHA_VERSION)
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $stats
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
        & sccache --stop-server
        if ($LASTEXITCODE -ne 0) {
            throw "sccache --stop-server failed with exit code $LASTEXITCODE"
        }
      shell: pwsh
    timeout-minutes: 180
  remote_server_builds:
    needs:
    - prepare_release
    - signing_preflight
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
      SCCACHE_GHA_ENABLED: on
      SCCACHE_IDLE_TIMEOUT: '0'
      RUSTC_WRAPPER: sccache
      CARGO_TARGET_DIR: target/products/${{ matrix.product }}
      ZED_PRODUCT_ID: ${{ matrix.product }}
      ZED_PRODUCT_DISPLAY_NAME: ${{ matrix.display_name }}
      ZED_PRODUCT_EXECUTABLE: ${{ matrix.executable_name }}
      ZED_PRODUCT_BUNDLE_ID: ${{ matrix.bundle_identifier }}
      ZED_PRODUCT_URL_SCHEME: ${{ matrix.url_scheme }}
      ZED_PRODUCT_ICON_SET: ${{ github.workspace }}/${{ matrix.icon_set }}
      ZED_PRODUCT_DATA_NAMESPACE: ${{ matrix.data_namespace }}
      ZED_PRODUCT_UPDATE_NAMESPACE: ${{ matrix.update_namespace }}
      ZED_PRODUCT_WINDOWS_INSTALLER_ID: ${{ matrix.windows_installer_id }}
      ZED_PRODUCT_APP_FEATURES: ${{ matrix.application_features }}
      ZED_PRODUCT_REMOTE_FEATURES: ${{ matrix.remote_features }}
      ZED_RELEASE_CHANNEL: stable
    strategy:
      matrix:
        include:
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: linux
          runner: ubuntu-22.04
          target: x86_64-unknown-linux-gnu
          remote_target: x86_64-unknown-linux-musl
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-linux-x86_64
          remote_artifact: rust-remote-server-linux-x86_64
          plan_file: rust-linux-x86_64.json
          artifact: rust-linux-x86_64
          artifact_suffix: linux-x86_64.tar.gz
          artifact_path: target/products/rust/release/rust-*-linux-x86_64.tar.gz*
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: macos
          runner: macos-15
          target: aarch64-apple-darwin
          remote_target: aarch64-apple-darwin
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-macos-aarch64
          remote_artifact: rust-remote-server-macos-aarch64
          plan_file: rust-macos-aarch64.json
          artifact: rust-macos-aarch64
          artifact_suffix: macos-aarch64.dmg
          artifact_path: target/products/rust/release/rust-*-macos-aarch64.dmg
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: windows
          runner: windows-2022
          target: x86_64-pc-windows-msvc
          remote_target: x86_64-pc-windows-msvc
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-windows-x86_64
          remote_artifact: rust-remote-server-windows-x86_64
          plan_file: rust-windows-x86_64.json
          artifact: rust-windows-x86_64
          artifact_suffix: windows-x86_64.exe
          artifact_path: target/products/rust/release/rust-*-windows-x86_64.exe
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::configure_release_cache_namespace
      run: |
        TOOLCHAIN_HASH="$(git hash-object rust-toolchain.toml)"
        echo "SCCACHE_GHA_VERSION=release-v2-${RUNNER_OS}-${CACHE_TARGET}-${TOOLCHAIN_HASH}" >> "$GITHUB_ENV"
      env:
        CACHE_TARGET: ${{ matrix.remote_target }}
    - name: steps::setup_release_sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0
        disable_annotations: 'true'
    - name: steps::enable_windows_long_paths
      if: matrix.platform == 'windows'
      run: git config --global core.longpaths true
      shell: pwsh
    - name: release::remote_server_builds
      if: matrix.platform == 'linux'
      run: ./script/linux && ./script/download-wasi-sdk
    - name: release::remote_server_builds
      if: matrix.platform == 'linux'
      run: |
        export ZED_PRODUCT_ARTIFACT_NAME="${ZED_PRODUCT_ID}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
        export ZED_BUNDLE_PHASE=remote-server
        script/bundle-linux
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        CC: clang
        CXX: clang++
    - name: release::remote_server_builds
      if: matrix.platform == 'macos'
      run: |
        export ZED_PRODUCT_ARTIFACT_NAME="${ZED_PRODUCT_ID}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
        export ZED_BUNDLE_PHASE=remote-server
        script/bundle-mac "$TARGET"
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        TARGET: ${{ matrix.target }}
    - name: release::remote_server_builds
      if: matrix.platform == 'windows'
      run: |
        $env:ZED_PRODUCT_ARTIFACT_NAME = "$env:ZED_PRODUCT_ID-$env:RELEASE_VERSION-$env:ARTIFACT_SUFFIX"
        $env:ZED_BUNDLE_PHASE = "remote-server"
        script/bundle-windows.ps1 -Architecture x86_64
      shell: pwsh
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
    - name: release::remote_server_builds
      if: matrix.platform != 'windows'
      run: |
        SOURCE="target/products/${PRODUCT_ID}/${REMOTE_TARGET}/release"
        mkdir -p release-remote-server
        cp "$SOURCE/remote_server" release-remote-server/
        jq -n --arg commit_sha "$COMMIT_SHA" --arg target "$REMOTE_TARGET" --arg features "$FEATURES" \
            '{commit_sha: $commit_sha, target: $target, features: $features}' > release-remote-server/metadata.json
      env:
        PRODUCT_ID: ${{ matrix.product }}
        REMOTE_TARGET: ${{ matrix.remote_target }}
        FEATURES: ${{ matrix.remote_features }}
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::remote_server_builds
      if: matrix.platform == 'windows'
      run: |
        $source = "target/products/$env:PRODUCT_ID/$env:REMOTE_TARGET/release"
        New-Item -ItemType Directory -Path release-remote-server -Force | Out-Null
        Copy-Item "$source/remote_server.exe", "$source/remote_server.pdb" -Destination release-remote-server
        @{
            commit_sha = $env:COMMIT_SHA
            target = $env:REMOTE_TARGET
            features = $env:FEATURES
        } | ConvertTo-Json | Set-Content release-remote-server/metadata.json
      shell: pwsh
      env:
        PRODUCT_ID: ${{ matrix.product }}
        REMOTE_TARGET: ${{ matrix.remote_target }}
        FEATURES: ${{ matrix.remote_features }}
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::remote_server_builds
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.remote_artifact }}
        path: release-remote-server
        if-no-files-found: error
    - name: steps::finalize_release_sccache
      if: always() && matrix.platform != 'windows'
      run: |
        STATS="$(sccache --show-stats)"
        printf '%s\n' "$STATS"
        {
            printf '### sccache: %s / %s\n\n```text\n' "$RUNNER_OS" "$SCCACHE_GHA_VERSION"
            printf '%s\n' "$STATS"
            printf '```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        sccache --stop-server
    - name: steps::finalize_release_sccache
      if: always() && matrix.platform == 'windows'
      run: |
        $stats = (& sccache --show-stats | Out-String)
        if ($LASTEXITCODE -ne 0) {
            throw "sccache --show-stats failed with exit code $LASTEXITCODE"
        }
        Write-Host $stats
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('### sccache: {0} / {1}' -f $env:RUNNER_OS, $env:SCCACHE_GHA_VERSION)
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $stats
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
        & sccache --stop-server
        if ($LASTEXITCODE -ne 0) {
            throw "sccache --stop-server failed with exit code $LASTEXITCODE"
        }
      shell: pwsh
    timeout-minutes: 120
  product_builds:
    needs:
    - prepare_release
    - release_licenses
    - application_builds
    - remote_server_builds
    runs-on: ${{ matrix.runner }}
    permissions:
