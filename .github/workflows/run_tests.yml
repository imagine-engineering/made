# Generated from xtask::workflows::run_tests
# Rebuild with `cargo xtask workflows`.
name: run_tests
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
on:
  pull_request:
    branches:
    - '**'
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  shared_clippy:
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::cargo_fmt
      run: cargo fmt --all -- --check
    - name: run_tests::shared_clippy
      run: ./script/clippy
    - name: run_tests::setup_inventory_python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: run_tests::shared_clippy
      run: |
        if git cat-file -e HEAD:projects/buzz/Cargo.toml 2>/dev/null; then
          ./script/check-collaborative-workspace-inventory --catalog all
        else
          echo '::notice::Collaborative workspace source is absent; full inventory audit deferred'
        fi
    - name: run_tests::shared_clippy
      run: python3 script/test-collaborative-workspace-inventory.py
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 60
  copper_tests:
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      SCCACHE_GHA_ENABLED: on
      SCCACHE_IDLE_TIMEOUT: '0'
      RUSTC_WRAPPER: sccache
      ZED_PRODUCT_ID: rust
      ZED_PRODUCT_UPDATE_BASE_URL: http://test.example
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: steps::setup_release_sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0
        disable_annotations: 'true'
    - name: Configure Copper compiler cache
      run: |
        TOOLCHAIN_HASH="$(git hash-object rust-toolchain.toml)"
        echo "SCCACHE_GHA_VERSION=copper-tests-v1-${RUNNER_OS}-${RUNNER_ARCH}-${TOOLCHAIN_HASH}" >> "$GITHUB_ENV"
      shell: bash -euxo pipefail {0}
    - name: steps::setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: steps::cargo_install_nextest
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
      with:
        tool: nextest
    - name: run_tests::copper_tests
      run: cargo nextest run --no-fail-fast --no-tests=warn --no-default-features --features zed/agentic-tools,zed/rust-tools,remote_server/rust-tools -p agent -p agent_ui -p auto_update -p call -p cargo_ui -p channel -p client -p collab_ui -p editor -p extension_host -p git -p git_ui -p language_model -p language_models -p language_tools -p languages -p project -p remote_server -p settings -p settings_content -p task -p tasks_ui -p terminal -p terminal_view -p worktree -p workspace -p zed -E 'not (test(=cargo_panel::tests::cargo_dashboard_foreground_budget) or test(=cargo_panel::tests::cargo_dashboard_production_foreground_budget) or test(=test_explorer::tests::structured_execution_foreground_budget))'
    - name: Measure Copper foreground budgets
      run: cargo nextest run --no-fail-fast --no-tests=fail --no-default-features --features zed/agentic-tools,zed/rust-tools,remote_server/rust-tools -p agent -p agent_ui -p auto_update -p call -p cargo_ui -p channel -p client -p collab_ui -p editor -p extension_host -p git -p git_ui -p language_model -p language_models -p language_tools -p languages -p project -p remote_server -p settings -p settings_content -p task -p tasks_ui -p terminal -p terminal_view -p worktree -p workspace -p zed -E '(test(=cargo_panel::tests::cargo_dashboard_foreground_budget) or test(=cargo_panel::tests::cargo_dashboard_production_foreground_budget) or test(=test_explorer::tests::structured_execution_foreground_budget))' --test-threads 1 --success-output immediate
    - name: steps::finalize_release_sccache
      if: always()
      run: |
        STATS="$(sccache --show-stats)"
        printf '%s\n' "$STATS"
        {
            printf '### sccache: %s / %s\n\n```text\n' "$RUNNER_OS" "$SCCACHE_GHA_VERSION"
            printf '%s\n' "$STATS"
            printf '```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        sccache --stop-server
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 90
  graphics_feature_validation:
    runs-on: ubuntu-22.04
    env:
      ZED_PRODUCT_ID: rust
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: run_tests::graphics_feature_validation
      run: |
        cargo test --locked -p graphics_core -p graphics_ui --lib
        cargo test --locked -p graphics_core --test native_worker
        cargo test --locked -p gpui --lib tab_stop::tests::
        cargo test --locked -p zed --no-default-features --features agentic-tools,sim --bin zed graphics_surface_respects_sim_feature
        cargo test --locked -p zed --no-default-features --features agentic-tools,sim --bin zed native_sim_
        ZED_PRODUCT_ID=jvm ZED_PRODUCT_DEV_PREVIEW=1 ZED_RELEASE_CHANNEL=dev cargo test --locked -p zed --no-default-features --features agentic-tools,jvm-tools --bin zed graphics_surface_respects_sim_feature
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 120
  project_benchmarks:
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    strategy:
      matrix:
        include:
        - benchmark: cargo_workspace
        - benchmark: structured_execution
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: run_tests::project_benchmarks
      if: matrix.benchmark == 'cargo_workspace'
      run: cargo bench -p project --features cargo-workspace --bench cargo_workspace -- --noplot
    - name: run_tests::project_benchmarks
      if: matrix.benchmark == 'structured_execution'
      run: cargo bench -p project --features structured-execution --bench structured_execution -- --noplot
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 75
  rust_tools_validation:
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: run_tests::rust_tools_validation
      run: python3 script/test-rust-tools-environments-failures.py
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: run_tests::rust_tools_validation
      run: cargo fetch --locked
    - name: run_tests::rust_tools_validation
      run: cargo test --locked --offline -p native_task_helper --lib
    - name: run_tests::rust_tools_validation
      run: ./script/test-rust-tools-environments --matrix --offline
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 45
  release_automation_validation:
    runs-on: ubuntu-22.04
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: run_tests::setup_inventory_python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: run_tests::release_automation_validation
      run: |
        python3 -m unittest discover -s script -p 'test_refresh_website.py'
        python3 -m unittest discover -s script -p 'test_product_release.py'
        python3 script/test-production-signing
        cargo test -p xtask
        cargo xtask workflows
        git diff --exit-code
        cargo xtask check-workflows
        python3 script/check-repository-inputs
        python3 script/test-repository-inputs.py
        cargo xtask products --check
        cargo xtask bundle --product rust \
          --platform linux \
          --target x86_64-unknown-linux-gnu \
          --dry-run
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 30
  multiplayer_tools_standard:
    runs-on: ubuntu-22.04
    env:
      ZED_PRODUCT_ID: rust
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: run_tests::setup_inventory_python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: run_tests::multiplayer_tools_profile
      run: ./script/check-multiplayer-tools --full --profile standard
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 120
  multiplayer_tools_multiplayer:
    runs-on: ubuntu-22.04
    env:
      ZED_PRODUCT_ID: rust
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: steps::setup_cargo_config
