    - name: run_tests::setup_inventory_python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: run_tests::multiplayer_tools_profile
      run: ./script/check-multiplayer-tools --full --profile multiplayer
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 120
  shared_validation:
    needs:
    - shared_clippy
    - copper_tests
    - graphics_feature_validation
    - project_benchmarks
    - rust_tools_validation
    - release_automation_validation
    - windows_updater_tests
    - windows_jvm_validation
    - multiplayer_tools_standard
    - multiplayer_tools_multiplayer
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
    - name: run_tests::shared_validation
      run: |
        exit_code=0
        if [[ "${SHARED_CLIPPY_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${COPPER_TESTS_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${GRAPHICS_FEATURE_VALIDATION_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${PROJECT_BENCHMARKS_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${RUST_TOOLS_VALIDATION_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${RELEASE_AUTOMATION_VALIDATION_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${WINDOWS_UPDATER_TESTS_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${WINDOWS_JVM_VALIDATION_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${MULTIPLAYER_TOOLS_STANDARD_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${MULTIPLAYER_TOOLS_MULTIPLAYER_RESULT}" != "success" ]]; then exit_code=1; fi
        exit "$exit_code"
      env:
        SHARED_CLIPPY_RESULT: ${{ needs.shared_clippy.result }}
        COPPER_TESTS_RESULT: ${{ needs.copper_tests.result }}
        GRAPHICS_FEATURE_VALIDATION_RESULT: ${{ needs.graphics_feature_validation.result }}
        PROJECT_BENCHMARKS_RESULT: ${{ needs.project_benchmarks.result }}
        RUST_TOOLS_VALIDATION_RESULT: ${{ needs.rust_tools_validation.result }}
        RELEASE_AUTOMATION_VALIDATION_RESULT: ${{ needs.release_automation_validation.result }}
        WINDOWS_UPDATER_TESTS_RESULT: ${{ needs.windows_updater_tests.result }}
        WINDOWS_JVM_VALIDATION_RESULT: ${{ needs.windows_jvm_validation.result }}
        MULTIPLAYER_TOOLS_STANDARD_RESULT: ${{ needs.multiplayer_tools_standard.result }}
        MULTIPLAYER_TOOLS_MULTIPLAYER_RESULT: ${{ needs.multiplayer_tools_multiplayer.result }}
    timeout-minutes: 5
  windows_updater_tests:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: 1.2.3
      ZED_PRODUCT_DISPLAY_NAME: Copper
      ZED_PRODUCT_WINDOWS_INSTALLER_ID: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
      ZED_PRODUCT_ICON_SET: ${{ github.workspace }}/assets/product_flavors/rust
    steps:
    - name: steps::enable_windows_long_paths
      run: git config --global core.longpaths true
      shell: pwsh
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: run_tests::windows_updater_tests
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        cargo test --locked -p auto_update_helper -p xtask -p windows_resources
        foreach ($version in @('1.2.3', '2.3.4-rc.2+build.7')) {
            $env:RELEASE_VERSION = $version
            cargo build --locked -p auto_update_helper
            $metadata = (Get-Item target/debug/auto_update_helper.exe).VersionInfo
            if ($metadata.ProductName -ne $env:ZED_PRODUCT_DISPLAY_NAME -or $metadata.FileVersion -ne $version -or $metadata.ProductVersion -ne $version) {
                throw "Updater product metadata does not match the resolved release environment"
            }
            $numeric = ($version -split '[-+]')[0] -split '\.'
            if ($metadata.FileMajorPart -ne [int]$numeric[0] -or $metadata.FileMinorPart -ne [int]$numeric[1] -or $metadata.FileBuildPart -ne [int]$numeric[2]) {
                throw "Updater numeric version lost a semantic version component"
            }
        }

        $innoSetupPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        $installerResourceLines = @(
            Get-Content crates/zed/resources/windows/zed.iss |
                Where-Object { $_ -match '^(AppId|SetupIconFile)=' }
        )
        if ($installerResourceLines.Count -ne 2) {
            throw "Expected the AppId and SetupIconFile directives in the Windows installer template"
        }
        $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'inno-installer-resource-validation'
        New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null
        $fixturePath = Join-Path $fixtureDirectory 'installer-resources.iss'
        $productIconPath = Join-Path $env:ZED_PRODUCT_ICON_SET 'app-icon.ico'
        @(
            '[Setup]'
            $installerResourceLines
            'AppName=Installer Identity Validation'
            'AppVersion=1.0.0'
            'DefaultDirName={tmp}\InstallerIdentityValidation'
            'Uninstallable=no'
        ) | Set-Content -Path $fixturePath -Encoding utf8
        & $innoSetupPath '/O-' "/DAppId=$env:ZED_PRODUCT_WINDOWS_INSTALLER_ID" "/DProductIconFile=$productIconPath" $fixturePath
        if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup rejected the catalog-derived installer identity or icon"
        }
      shell: pwsh
    timeout-minutes: 45
  windows_jvm_validation:
    runs-on: windows-2022
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - name: steps::enable_windows_long_paths
      run: git config --global core.longpaths true
      shell: pwsh
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: run_tests::windows_jvm_validation
      run: cargo test --locked -p fs --features test-support --test integration real_fs_confined_file_rejects_replaced_paths
      shell: pwsh
    - name: run_tests::windows_jvm_validation
      run: cargo test --locked -p project --features jvm-tools,test-support --test integration collects_windows_maven_report_and_rejects_parent_junction
      shell: pwsh
    - name: run_tests::windows_jvm_validation
      run: cargo test --locked -p onboarding --lib windows_path_jdk_probe_keeps_java_and_javac_in_one_installation
      shell: pwsh
    - name: run_tests::windows_jvm_validation
      run: cargo test --locked -p terminal_view --features jvm-tools,test-support --lib groovy_build_uses_existing_terminal_panel
      shell: pwsh
    - name: run_tests::windows_jvm_validation
      run: cargo test --locked -p tasks_ui --features jvm-test-actions --lib selected_java_windows_maven_case_uses_tests_panel_and_task_terminal
      shell: pwsh
    timeout-minutes: 90
  sim_backend_validation:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
        - platform: linux
          runner: ubuntu-22.04
        - platform: macos
          runner: macos-15
        - platform: windows
          runner: windows-2022
      fail-fast: false
    steps:
    - name: steps::enable_windows_long_paths
      if: matrix.platform == 'windows'
      run: git config --global core.longpaths true
      shell: pwsh
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      if: matrix.platform == 'linux'
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_cargo_config
      if: matrix.platform == 'macos'
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_cargo_config
      if: matrix.platform == 'windows'
      run: |
        New-Item -ItemType Directory -Path "./../.cargo" -Force
        Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./../.cargo/config.toml"
      shell: pwsh
    - name: run_tests::sim_backend_validation
      if: matrix.platform == 'linux'
      run: cargo clippy --release --all-targets --all-features -p sim_backend_corex -p sim_backend_cuda -p sim_backend_directml -p sim_backend_metal -p sim_backend_mlu -p sim_backend_npu -p sim_backend_rocm -p sim_backend_xpu -- --deny warnings
    - name: run_tests::sim_backend_validation
      if: matrix.platform == 'macos'
      run: cargo clippy --release --all-targets --all-features -p sim_backend_metal -- --deny warnings
    - name: run_tests::sim_backend_validation
      if: matrix.platform == 'windows'
      run: cargo clippy --release --all-targets --all-features -p sim_backend_cuda -p sim_backend_directml -- --deny warnings
      shell: pwsh
    - name: steps::cleanup_cargo_config
      if: always() && matrix.platform == 'linux'
      run: |
        rm -rf ./../.cargo
    - name: steps::cleanup_cargo_config
      if: always() && matrix.platform == 'macos'
      run: |
        rm -rf ./../.cargo
    - name: steps::cleanup_cargo_config
      if: always() && matrix.platform == 'windows'
      run: |
        Remove-Item -Recurse -Path "./../.cargo" -Force -ErrorAction SilentlyContinue
      shell: pwsh
    timeout-minutes: 60
  product_smoke:
    needs:
    - shared_validation
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    strategy:
      matrix:
        include:
        - product: rust
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: run_tests::product_smoke
      run: cargo xtask bundle --product "$PRODUCT_ID" --platform linux --target x86_64-unknown-linux-gnu --dry-run
      env:
        PRODUCT_ID: ${{ matrix.product }}
    - name: run_tests::product_smoke
      run: cargo check --release --package zed --no-default-features --features "$APPLICATION_FEATURES"
      env:
        ZED_PRODUCT_ID: ${{ matrix.product }}
        APPLICATION_FEATURES: ${{ matrix.application_features }}
    - name: run_tests::product_smoke
      run: cargo check --release --package remote_server --no-default-features --features "$REMOTE_FEATURES"
      env:
        ZED_PRODUCT_ID: ${{ matrix.product }}
        REMOTE_FEATURES: ${{ matrix.remote_features }}
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 45
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
