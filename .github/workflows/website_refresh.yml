# Generated from xtask::workflows::website_refresh
# Rebuild with `cargo xtask workflows`.
name: website_refresh
on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published Copper tag (copper-vX.Y.Z); never builds or publishes Copper
        required: true
        type: string
permissions:
  contents: read
jobs:
  refresh_website:
    if: (github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false && !contains(github.event.release.body, '"preparation_scope":"macos-only"')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: main
    - name: website_refresh::refresh_job
      run: python3 script/refresh_website.py
      shell: bash -euo pipefail {0}
      env:
        COPPER_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        GH_TOKEN: ${{ github.token }}
        AMPLIFY_REBUILD_WEBHOOK: ${{ secrets.AMPLIFY_REBUILD_WEBHOOK }}
    concurrency:
      group: website-main-release-refresh
      cancel-in-progress: false
    timeout-minutes: 30
defaults:
  run:
    shell: bash -euxo pipefail {0}
