[package]
description = "The fast, collaborative code editor."
edition.workspace = true
name = "zed"
version = "1.16.2"
publish.workspace = true
license = "GPL-3.0-or-later"
authors = ["Zed Team <hi@zed.dev>"]
default-run = "zed"

[lints]
workspace = true

[features]
default = ["agentic-tools"]
agentic-tools = [
    "dep:acp_thread",
    "dep:acp_tools",
    "dep:agent",
    "dep:agent-client-protocol",
    "dep:agent_settings",
    "dep:agent_skills",
    "dep:agent_ui",
    "dep:language_models",
    "dep:prompt_store",
    "dep:sidebar",
    "dep:web_search",
    "dep:web_search_providers",
    "auto_update_ui/agentic",
    "diagnostics/agentic",
    "editor/agentic",
    "extensions_ui/agentic",
    "git_ui/agentic",
    "onboarding/agentic",
    "settings_ui/agentic",
    "terminal_view/agentic",
    "workspace/agentic",
    "zed_actions/agentic",
]
multiplayer-tools = [
    "agentic-tools",
    "agent/multiplayer-tools",
    "dep:nostr_compat",
    "agent_ui/multiplayer-tools",
    "channel/multiplayer-tools",
    "collab_ui/multiplayer-tools",
    "git_ui/multiplayer-tools",
    "onboarding/multiplayer-tools",
    "sidebar/multiplayer-tools",
    "tasks_ui/multiplayer-tools",
    "title_bar/multiplayer-tools",
    "zed_credentials_provider/multiplayer-tools",
    "workspace/multiplayer-tools",
]
multiplayer-test-support = ["multiplayer-tools", "agent_ui/test-support"]
sim = [
    "dep:graphics_ui",
    "dep:clock",
    "dep:sim_api",
    "dep:sim_model",
    "dep:sim_plugin_host",
    "dep:sim_runtime",
    "dep:sim_tensor",
    "dep:sim_types",
    "dep:sim_ui",
]
sim-test-support = ["sim", "test-support", "sim_ui/test-support"]
rust-tools = ["dep:cargo_ui", "tasks_ui/rust-test-actions", "diagnostics/rust-tools"]
jvm-tools = ["dep:jvm_ui", "extension_host/jvm-test-runnables", "project/jvm-tools", "tasks_ui/jvm-test-actions", "workspace/jvm-tools", "diagnostics/jvm-tools"]
corex = ["sim", "sim_runtime/corex"]
cuda = ["sim", "sim_runtime/cuda"]
directml = ["sim", "sim_runtime/directml"]
metal = ["sim", "sim_runtime/metal"]
mlu = ["sim", "sim_runtime/mlu"]
npu = ["sim", "sim_runtime/npu"]
rocm = ["sim", "sim_runtime/rocm"]
xpu = ["sim", "sim_runtime/xpu"]
tracy = ["ztracing/tracy"]
runtime-shaders = ["gpui_platform/runtime_shaders"]
# LEAK_BACKTRACE=1 cargo run --features zed/track-project-leak --profile release-fast
track-project-leak = ["gpui/leak-detection"]
test-support = [
    "agentic-tools",
    "agent/test-support",
    "dep:tempfile",
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "dep:image",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "image_viewer/test-support",
    "recent_projects/test-support",
    "repl/test-support",
    "title_bar/test-support",
]
visual-tests = [
    "agentic-tools",
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "gpui_platform/test-support",
    "dep:image",
    "dep:tempfile",
    "dep:action_log",
    "dep:agent_servers",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "image_viewer/test-support",
    "clock/test-support",
    "acp_thread/test-support",
    "action_log/test-support",
    "agent_ui/test-support",
    "channel/test-support",
    "db/test-support",
    "agent/test-support",
    "language_model/test-support",
    "fs/test-support",
    "recent_projects/test-support",
    "title_bar/test-support",
]

[[bin]]
name = "zed"
path = "src/main.rs"

[[bin]]
name = "zed_visual_test_runner"
path = "src/visual_test_runner.rs"
required-features = ["visual-tests"]

