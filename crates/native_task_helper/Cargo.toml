[package]
name = "native_task_helper"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Shared authenticated native Task helper protocol"

[lints]
workspace = true

[lib]
path = "src/native_task_helper.rs"

[dependencies]
futures-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
futures.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
test-support = []
runtime-helper = []

[[bin]]
name = "native-cargo-runtime-observer"
path = "src/native_cargo_runtime_observer.rs"
required-features = ["runtime-helper"]
