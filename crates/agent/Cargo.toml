[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
path = "src/agent.rs"

[features]
multiplayer-tools = [
    "dep:collaboration_domain",
    "acp_thread/multiplayer-tools",
    "dep:nostr",
    "dep:nostr_compat",
]
test-support = ["db/test-support"]
unit-eval = []
e2e = []

[lints]
workspace = true

[dependencies]
acp_thread.workspace = true
action_log.workspace = true
node_runtime.workspace = true
async-channel.workspace = true
async-trait.workspace = true
async-tar.workspace = true
agent-client-protocol.workspace = true
agent_servers.workspace = true
agent_settings.workspace = true
agent_skills.workspace = true
anyhow.workspace = true
base64.workspace = true
bech32.workspace = true
cap-std.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cron.workspace = true
client.workspace = true
cloud_api_types.workspace = true
cloud_llm_client.workspace = true
collections.workspace = true
collaboration_domain = { workspace = true, optional = true }
context_server.workspace = true
credentials_provider.workspace = true
db.workspace = true
feature_flags.workspace = true
fs.workspace = true
futures.workspace = true
git.workspace = true
gpui.workspace = true
handlebars = { workspace = true, features = ["rust-embed"] }
heck.workspace = true
html_to_markdown.workspace = true
http_client.workspace = true
http_proxy.workspace = true
iana-time-zone = "0.1"
indoc.workspace = true
itertools.workspace = true
jsonschema.workspace = true
language.workspace = true
language_model.workspace = true
language_models.workspace = true
log.workspace = true
nostr = { workspace = true, features = ["nip44"], optional = true }
nostr_compat = { workspace = true, optional = true }
parking_lot.workspace = true
paths.workspace = true
project.workspace = true
product_flavor.workspace = true
prompt_store.workspace = true
quick-xml.workspace = true
regex.workspace = true
remote.workspace = true
rust-embed.workspace = true
sandbox.workspace = true
schemars.workspace = true
scheduler.workspace = true
secp256k1.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_yaml.workspace = true
settings.workspace = true
sha2.workspace = true
shell_command_parser.workspace = true
smallvec.workspace = true
sqlez.workspace = true
streaming_diff.workspace = true
strsim.workspace = true
task.workspace = true
telemetry.workspace = true
tempfile.workspace = true
text.workspace = true
thiserror.workspace = true
ui.workspace = true
url.workspace = true
util.workspace = true
uuid.workspace = true
watch.workspace = true
web_search.workspace = true
zed_env_vars.workspace = true
zstd.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Used only on Windows to resolve the running release channel/version so the WSL
# sandbox helper can fetch a matching Linux `zed`.
[target.'cfg(target_os = "windows")'.dependencies]
release_channel.workspace = true

[dev-dependencies]
extension.workspace = true
node_runtime.workspace = true
release_channel.workspace = true
remote_server = { workspace = true, features = ["test-support"] }
semver.workspace = true
assets.workspace = true
async-io.workspace = true
agent_servers = { workspace = true, "features" = ["test-support"] }
client = { workspace = true, "features" = ["test-support"] }
clock = { workspace = true, "features" = ["test-support"] }
context_server = { workspace = true, "features" = ["test-support"] }
ctor.workspace = true
db = { workspace = true, "features" = ["test-support"] }
editor = { workspace = true, "features" = ["test-support"] }
env_logger.workspace = true
eval_utils.workspace = true
fs = { workspace = true, "features" = ["test-support"] }
git = { workspace = true, "features" = ["test-support"] }
gpui = { workspace = true, "features" = ["test-support"] }
gpui_tokio.workspace = true
language = { workspace = true, "features" = ["test-support"] }
language_model = { workspace = true, "features" = ["test-support"] }
lsp = { workspace = true, "features" = ["test-support"] }
pretty_assertions.workspace = true
project = { workspace = true, "features" = ["test-support"] }
proptest.workspace = true
rand.workspace = true
reqwest_client.workspace = true
settings = { workspace = true, "features" = ["test-support"] }

theme = { workspace = true, "features" = ["test-support"] }
theme_settings.workspace = true

unindent = { workspace = true }

zlog.workspace = true

[[test]]
name = "agent_memory_repository"
path = "tests/agent_memory_repository.rs"
required-features = ["multiplayer-tools", "test-support"]

