syntax = "proto3";
package zed.messages;

import "worktree.proto";

message GetSourceCoverage {
  uint64 project_id = 1;
  string provider_id = 2;
  repeated uint64 worktree_ids = 3;
}

message InterpretRustCoverageArtifact {
  uint64 project_id = 1;
  ProjectPath artifact_path = 2;
  uint64 max_bytes = 3;
}

message RunRustCoverageTask {
  uint64 project_id = 1;
  uint64 operation_id = 2;
  ProjectPath workspace_root = 3;
  ProjectPath package_manifest = 4;
  RustCoverageTargetKind target_kind = 5;
  string target_name = 6;
  bytes session_token = 7;
}

enum RustCoverageTargetKind {
  RUST_COVERAGE_TARGET_KIND_UNSPECIFIED = 0;
  RUST_COVERAGE_TARGET_KIND_BINARY = 1;
  RUST_COVERAGE_TARGET_KIND_EXAMPLE = 2;
}

message CancelRustCoverageTask {
  uint64 project_id = 1;
  uint64 operation_id = 2;
  bytes session_token = 3;
}

message GetRustCoverageTaskSession {
  uint64 project_id = 1;
}

message RustCoverageTaskResponse {
  uint64 operation_id = 1;
  oneof outcome {
    SourceCoverageResponse coverage = 2;
    bool cancelled = 3;
    RustCoverageTaskFailure failure = 4;
    bytes session_token = 6;
  }
  // Assigned and consumed by the direct remote server before sending the reply.
  uint32 native_receiver = 5;
}

enum RustCoverageTaskFailure {
  RUST_COVERAGE_TASK_FAILURE_UNSPECIFIED = 0;
  RUST_COVERAGE_TASK_FAILURE_UNSUPPORTED = 1;
  RUST_COVERAGE_TASK_FAILURE_RESTRICTED = 2;
  RUST_COVERAGE_TASK_FAILURE_INVALID_SELECTION = 3;
  RUST_COVERAGE_TASK_FAILURE_STALE = 4;
  RUST_COVERAGE_TASK_FAILURE_BUSY = 5;
  RUST_COVERAGE_TASK_FAILURE_HOST_FAILED = 6;
}

message SourceCoverageResponse {
  uint64 project_generation = 1;
  string provider_id = 2;
  uint64 generation = 3;
  SourceCoverageStatus status = 4;
  repeated SourceCoverageFile files = 5;
  bool truncated = 6;
  optional string diagnostic = 7;
}

message SourceCoverageFile {
  ProjectPath path = 1;
  repeated SourceCoverageRange ranges = 2;
  uint32 covered_lines = 3;
  uint32 uncovered_lines = 4;
  bool truncated = 5;
}

message SourceCoverageRange {
  uint32 start_line = 1;
  uint32 start_column = 2;
  uint32 end_line = 3;
  uint32 end_column = 4;
  uint64 hit_count = 5;
}

enum SourceCoverageStatus {
  SOURCE_COVERAGE_STATUS_LOADING = 0;
  SOURCE_COVERAGE_STATUS_CURRENT = 1;
  SOURCE_COVERAGE_STATUS_EMPTY = 2;
  SOURCE_COVERAGE_STATUS_PARTIAL = 3;
  SOURCE_COVERAGE_STATUS_STALE = 4;
  SOURCE_COVERAGE_STATUS_ERROR = 5;
  SOURCE_COVERAGE_STATUS_RESTRICTED = 6;
  SOURCE_COVERAGE_STATUS_DISCONNECTED = 7;
  SOURCE_COVERAGE_STATUS_MISMATCH = 8;
  SOURCE_COVERAGE_STATUS_CANCELLED = 9;
}
