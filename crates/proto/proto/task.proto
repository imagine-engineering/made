syntax = "proto3";
package zed.messages;

import "buffer.proto";

message TaskContextForLocation {
  uint64 project_id = 1;
  Location location = 2;
  map<string, string> task_variables = 3;
}

message TaskContext {
  optional string cwd = 1;
  map<string, string> task_variables = 2;
  map<string, string> project_env = 3;
}

message Shell {
  message WithArguments {
    string program = 1;
    repeated string args = 2;
  }

  oneof shell_type {
    System system = 1;
    string program = 2;
    WithArguments with_arguments = 3;
  }
}

message System {}

enum RevealStrategy {
  RevealAlways = 0;
  RevealNever = 1;
}

enum HideStrategy {
  HideAlways = 0;
  HideNever = 1;
  HideOnSuccess = 2;
}

message SpawnInTerminal {
  string label = 1;
  optional string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  optional string cwd = 5;
  repeated string required_experimental_features = 6;
}

message GetDirectoryEnvironment {
  uint64 project_id = 1;
  Shell shell = 2;
  string directory = 3;
}

message DirectoryEnvironment {
  map<string, string> environment = 1;
}

message ResolveJvmBuildOperation {
  uint64 project_id = 1;
  uint32 protocol_version = 2;
  uint64 session_generation = 3;
  uint64 worktree_id = 4;
  uint64 server_id = 5;
  uint64 snapshot_generation = 6;
  string module_path = 7;
  string selection_json = 8;
  JvmBuildOperationAuthorization authorization = 9;
}

message JvmBuildOperationAuthorization {
  string task_id = 1;
  string token = 2;
}

message JvmBuildOperationResponse {
  uint32 protocol_version = 1;
  JvmBuildOperationAuthorization authorization = 2;
  string label = 3;
  string command = 4;
  repeated string arguments = 5;
  string working_directory = 6;
  map<string, string> environment = 7;
  uint32 literal_prefix_arguments = 8;
  bool windows_direct_program = 9;
}
