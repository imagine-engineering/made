[package]
name = "diagnostics"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/diagnostics.rs"
doctest = false

[features]
default = []
test-support = ["http_client?/test-support"]
rust-tools = ["project/rust-tests", "dep:toml", "dep:dap", "dep:language_tools", "dep:paths", "dep:async_zip", "dep:http_client", "dep:libc", "dep:semver"]
jvm-tools = ["dep:quick-xml", "dep:dap", "project/jvm-tools", "dep:flate2", "dep:rmpv", "dep:tempfile", "dep:paths", "dep:libc", "dep:async_zip", "dep:http_client", "dep:semver"]
agentic = ["dep:git", "dep:git_hosting_providers", "dep:http_client", "dep:context_server", "dep:agent_settings", "dep:agent", "dep:language_model", "dep:extension_host", "dep:chrono", "extension_host/agentic", "zed_actions/agentic"]

[dependencies]
command_palette_hooks.workspace = true
feature_flags.workspace = true
git = { workspace = true, optional = true }
git_hosting_providers = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
async_zip = { workspace = true, optional = true }
http_client = { workspace = true, optional = true }
dap = { workspace = true, optional = true }
language_tools = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
rmpv = { version = "1.3.0", optional = true }
tempfile = { workspace = true, optional = true }
paths = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
context_server = { workspace = true, optional = true }
agent = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
extension_host = { workspace = true, optional = true }
language_model = { workspace = true, optional = true }
agent_settings = { workspace = true, optional = true }
anyhow.workspace = true
async-channel.workspace = true
async-lock.workspace = true
collections.workspace = true
component.workspace = true
ctor.workspace = true
db.workspace = true
editor.workspace = true
futures-lite.workspace = true
futures.workspace = true
fs.workspace = true
gpui.workspace = true
indoc.workspace = true
itertools.workspace = true
language.workspace = true
log.workspace = true
lsp.workspace = true
markdown.workspace = true
product_flavor.workspace = true
project.workspace = true
remote.workspace = true
rpc.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
settings.workspace = true
smol.workspace = true
text.workspace = true
time.workspace = true
time_format.workspace = true
theme.workspace = true
theme_settings.workspace = true
task.workspace = true
url.workspace = true
ui.workspace = true
util.workspace = true
uuid.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[dev-dependencies]
agent = { workspace = true, features = ["test-support"] }
context_server = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
async-trait.workspace = true
dap = { workspace = true, features = ["test-support"] }
remote = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
release_channel.workspace = true
semver.workspace = true
language_model = { workspace = true, features = ["test-support"] }

db = { workspace = true, features = ["test-support"] }

editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
lsp = { workspace = true, features = ["test-support"] }
markdown = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
serde_json.workspace = true
theme = { workspace = true, features = ["test-support"] }
unindent.workspace = true
workspace = { workspace = true, features = ["test-support"] }
zlog.workspace = true
